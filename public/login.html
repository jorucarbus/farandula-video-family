<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farandula Video - Familia</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Inter', sans-serif;
    }

    .login-card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
    }

    .login-card h1 {
      margin: 0 0 30px;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2f8f2f;
    }

    .form-group input::placeholder {
      color: #999;
    }

    .password-requirements {
      display: none;
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }

    .password-requirements.show {
      display: block;
    }

    .req {
      margin: 4px 0;
    }

    .req.ok {
      color: #2f8f2f;
    }

    .req.missing {
      color: #d32f2f;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #e0e0e0;
    }

    .tab-button {
      padding: 12px 20px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: #999;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .tab-button.active {
      color: #2f8f2f;
      border-bottom-color: #2f8f2f;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border: none;
      background: linear-gradient(135deg, #2f8f2f 0%, #1d5d1d 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(47, 143, 47, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      display: none;
      background: #ffebee;
      color: #d32f2f;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .error-message.show {
      display: block;
    }

    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>🎬 Farandula Video</h1>

      <div class="tabs">
        <button class="tab-button active" onclick="switchTab('login')">Ingresar</button>
        <button class="tab-button" onclick="switchTab('signup')">Registrarse</button>
      </div>

      <!-- Login Tab -->
      <div id="login" class="tab-content active">
        <div class="error-message" id="login-error"></div>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Correo electrónico</label>
            <input
              type="email"
              id="login-email"
              placeholder="tu@email.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="login-password">Contraseña</label>
            <input
              type="password"
              id="login-password"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="btn-primary" id="login-btn">
            Ingresar
          </button>
        </form>
      </div>

      <!-- Signup Tab -->
      <div id="signup" class="tab-content">
        <div class="error-message" id="signup-error"></div>
        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label for="signup-email">Correo electrónico</label>
            <input
              type="email"
              id="signup-email"
              placeholder="tu@email.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="signup-password">Contraseña</label>
            <input
              type="password"
              id="signup-password"
              placeholder="Min. 8 caracteres"
              required
              onkeyup="updatePasswordRequirements()"
              onfocus="showPasswordRequirements()"
            />
            <div class="password-requirements" id="password-reqs">
              <div class="req" id="req-length">• Al menos 8 caracteres</div>
              <div class="req" id="req-upper">• Una mayúscula</div>
              <div class="req" id="req-lower">• Una minúscula</div>
              <div class="req" id="req-number">• Un número</div>
            </div>
          </div>

          <button type="submit" class="btn-primary" id="signup-btn">
            Crear cuenta
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin + '/api';

    function switchTab(tab) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tab).classList.add('active');
    }

    function showPasswordRequirements() {
      document.getElementById('password-reqs').classList.add('show');
    }

    function updatePasswordRequirements() {
      const password = document.getElementById('signup-password').value;

      const checks = {
        'req-length': password.length >= 8,
        'req-upper': /[A-Z]/.test(password),
        'req-lower': /[a-z]/.test(password),
        'req-number': /[0-9]/.test(password),
      };

      Object.entries(checks).forEach(([id, ok]) => {
        const el = document.getElementById(id);
        el.classList.toggle('ok', ok);
        el.classList.toggle('missing', !ok);
      });
    }

    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      const errorDiv = document.getElementById('login-error');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span>Ingresando...';
      errorDiv.classList.remove('show');

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error al ingresar');
        }

        localStorage.setItem('token', data.token);
        window.location.href = '/';
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Ingresar';
      }
    }

    async function handleSignup(event) {
      event.preventDefault();

      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const btn = document.getElementById('signup-btn');
      const errorDiv = document.getElementById('signup-error');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span>Creando cuenta...';
      errorDiv.classList.remove('show');

      try {
        const res = await fetch(`${API_URL}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error al crear cuenta');
        }

        localStorage.setItem('token', data.token);
        window.location.href = '/';
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Crear cuenta';
      }
    }
  </script>
</body>
</html>
